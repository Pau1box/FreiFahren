# Mainz. Generated by scripts/discover_networks.py as `wiesbaden`, then corrected by hand.
#
# The discovery names a network after the largest place near its routes, and Wiesbaden is larger
# than Mainz. The tram is Mainz's, though: Wiesbaden gave its own up in 1955 and is served by the
# Mainzer Verkehrsgesellschaft across the Rhine. The first build made that plain, all 59 stations
# came out south of the river and the declared centre fell outside them, which the validator
# rejected.
#
# Discovered from 11 OpenStreetMap route relations.

id: mainz
name: Mainz
countryCode: DE
timezone: Europe/Berlin
# Every generated network starts in beta. It shows only reports people actually made, never
# predicted ones, because there is no history to reason from yet.
status: beta

center:
    latitude: 49.9929
    longitude: 8.2473
# Derived from the generated stations, so the map fits the network that was actually built.
bounds: auto

source:
    # A box rather than a city boundary, because the system crosses municipal borders and no single
    # administrative area contains it. The corners come from the route midpoints found in
    # OpenStreetMap plus a margin, and the validator rejects a build that spans more than 200 km.
    boundingBox:
        southWest:
            latitude: 49.7988
            longitude: 7.9394
        northEast:
            latitude: 50.1829
            longitude: 8.5712
    modes:
        light_rail: auto
        tram: auto
    lines: auto

stations:
    mergeRadiusMeters: 250
    # No plain `ref` fallback: `ref` is only unique per operator, so trusting it risks colliding with
    # another network's station id. DS100 codes are unique across Germany and node ids by construction.
    idSources: [ref:ds100, railway:ref]
