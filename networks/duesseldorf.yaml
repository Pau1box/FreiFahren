# Düsseldorf. Generated by scripts/discover_networks.py, then reviewed by hand.
#
# The network is the connected system, not the municipality: it reaches beyond the city
# limits. Which cities exactly is generated into network.json when the network is built.
# Discovered from 120 OpenStreetMap route relations.

id: duesseldorf
name: Düsseldorf
countryCode: DE
timezone: Europe/Berlin
# Every generated network starts in beta. It shows only reports people actually made, never
# predicted ones, because there is no history to reason from yet.
status: beta

center:
    latitude: 51.2254
    longitude: 6.7763
# Derived from the generated stations, so the map fits the network that was actually built.
bounds: auto

source:
    # A box rather than a city boundary, because the system crosses municipal borders and no single
    # administrative area contains it. The corners come from the route midpoints found in
    # OpenStreetMap plus a margin, and the validator rejects a build that spans more than 200 km.
    boundingBox:
        southWest:
            latitude: 51.0141
            longitude: 6.2626
        northEast:
            latitude: 51.7208
            longitude: 7.8086
    modes:
        subway: auto
        tram: auto
    lines:
        exclude:
            # The Bergische Museumsbahn, a heritage tramway at Wuppertal-Kohlfurth that runs on
            # summer weekends. It is the kind of operation `accepts_route` already drops, but only
            # where OpenStreetMap tags it `usage=tourism`, and this relation carries no such tag.
            # Left in, it added six stops 24 km from any other line in the network, and none of them
            # is a place anyone is checked for a ticket.
            - BMB

stations:
    mergeRadiusMeters: 250
    # No plain `ref` fallback: `ref` is only unique per operator, so trusting it risks colliding with
    # another network's station id. DS100 codes are unique across Germany and node ids by construction.
    idSources: [ref:ds100, railway:ref]
